---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-backend
  namespace: people-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: people-backend
  template:
    metadata:
      labels:
        app: people-backend
    spec:
      containers:
        - env:
            - name: PORT
              value: '5001'
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: '3306'
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: mysql-secret
            - name: DB_NAME
              value: peopledb
          image: davidtejusvi/people-backend:1.0
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 20
          name: backend
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: people-backend
  namespace: people-app
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: people-backend
  type: ClusterIP