---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-frontend
  namespace: people-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: people-frontend
  template:
    metadata:
      labels:
        app: people-frontend
    spec:
      containers:
        - image: davidtejusvi/people-frontend:1.1
          imagePullPolicy: Always
          name: frontend
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: people-frontend
  namespace: people-app
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: people-frontend
  type: NodePort